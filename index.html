<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MedConduta — Estudo e prática clínica</title>
  <meta name="description" content="Plataforma de estudo estruturado para residência (R1) e guia de bolso para prática clínica. Uso educacional — conteúdo clínico é rascunho a validar." />
  <meta name="theme-color" content="#2457d6" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap" />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>

  <div class="app-shell" id="app-shell">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <div class="sidebar__brand">
        <div class="sidebar__brand-mark" aria-hidden="true">M</div>
        <span class="sidebar__brand-name">MedConduta</span>
      </div>

      <nav id="sidebar-nav"><!-- injetado por app/components/sidebar.js --></nav>

      <div class="sidebar__footer">
        <button class="sidebar__collapse-btn" id="sidebar-collapse" type="button" aria-label="Recolher menu">
          ⟨⟩ <span>Recolher menu</span>
        </button>
      </div>
    </aside>

    <div class="app-content">
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="topbar-menu-btn" aria-label="Abrir menu">☰</button>
        <div class="topbar__brand">
          <div class="sidebar__brand-mark" aria-hidden="true" style="width:28px;height:28px;font-size:14px;">M</div>
          MedConduta
        </div>
        <button type="button" class="topbar-busca" id="topbar-busca" aria-label="Buscar (Ctrl+K)">
          <span class="topbar-busca__icone" id="topbar-busca-icone"></span>
          <span class="topbar-busca__texto">Buscar temas e telas…</span>
          <kbd class="topbar-busca__atalho">Ctrl K</kbd>
        </button>
        <div class="topbar__acoes">
          <a class="topbar-streak" id="topbar-streak" href="#/residencia/minha-preparacao" title="Dias seguidos estudando" hidden></a>
          <a class="btn btn--secondary btn--sm topbar-foco" id="topbar-foco" href="#/residencia/foco" title="Modo Foco"></a>
          <div class="perfil">
            <button type="button" class="perfil__avatar" id="perfil-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu do perfil"></button>
            <div class="perfil__menu" id="perfil-menu" hidden>
              <div class="perfil__email" id="perfil-email"></div>
              <button class="nav-link" id="theme-toggle" type="button"></button>
              <a class="nav-link" id="perfil-admin" href="#/residencia/admin" hidden></a>
              <button class="nav-link" id="logout-btn" type="button"></button>
            </div>
          </div>
        </div>
      </header>

      <main class="main" id="main-content" tabindex="-1" aria-live="polite" aria-busy="false"></main>
    </div>
  </div>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação inferior"></nav>

  <script type="module" src="app/main.js"></script>
</body>
</html>
