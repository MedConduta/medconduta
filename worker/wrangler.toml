name = "medconduta-ai"
main = "src/index.js"
compatibility_date = "2026-01-01"

# GEMINI_API_KEY NÃO fica aqui — é secret, configurado com:
#   npx wrangler secret put GEMINI_API_KEY
#
# Para trocar de modelo sem mexer no código, descomente e ajuste:
# [vars]
# GEMINI_MODEL = "gemini-2.5-flash-lite"

# Banco D1 (Fase 1 — backend + autenticação). Depois de rodar
# `npx wrangler d1 create medconduta`, cole o database_id retornado aqui.
[[d1_databases]]
binding = "DB"
database_name = "medconduta"
database_id = "COLOQUE_AQUI_O_ID_RETORNADO_POR_WRANGLER_D1_CREATE"
